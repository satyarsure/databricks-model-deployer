bundle:
  name: satya-takeda-poc-app

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  job_id:
    description: Numeric Databricks job ID. Find it in the Jobs UI or via `databricks jobs list`.

resources:
  apps:
    app:
      name: "satya-takeda-poc-app"
      description: "Deploy model artifacts to Databricks Model Serving"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, dashboards.genie, files.files, serving.serving-endpoints
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: job
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN

targets:
  default:
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      profile: DEFAULT1
      root_path: /Workspace/Users/satyendranath.sure@databricks.com/Takeda/mlops_test_20260829/app

    variables:
      sql_warehouse_id: 148ccb90800933a1
      job_id: 896582988828764
