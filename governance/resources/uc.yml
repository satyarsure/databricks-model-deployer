resources:
  schemas:
    app_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Model Deployer — registered models + artifacts volume
      grants:
        # USE_SCHEMA for the principal that registers/reads models here (a UC group or the deploy
        # job's identity). The app's status/lifecycle data lives in Lakebase Postgres, not UC, and
        # its access is granted automatically by the deploy job — so no table SELECT is needed here.
        - principal: ${var.app_grantee}
          privileges:
            - USE_SCHEMA
      lifecycle:
        # Never drop the schema (and its data) on `bundle destroy`.
        prevent_destroy: true

  volumes:
    artifacts:
      catalog_name: ${var.catalog}
      # Reference the managed schema resource (not ${var.schema}) so DABs orders the schema
      # create before the volume on a first deploy.
      schema_name: ${resources.schemas.app_schema.name}
      name: artifacts
      volume_type: MANAGED
      comment: Model Deployer — uploaded/test model artifacts
      grants:
        - principal: ${var.app_grantee}
          privileges:
            - READ_VOLUME
            # - WRITE_VOLUME   # uncomment if end users upload artifacts through UC
      lifecycle:
        prevent_destroy: true

# USE CATALOG on a shared/pre-existing catalog stays a one-line manual grant. If this bundle should
# also own the catalog, add a `catalogs:` resource here with its own grants block.
