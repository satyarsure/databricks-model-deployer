bundle:
  name: mlops-deploy-job

include:
  - resources/*.yml
  - "*.local.yml" # gitignored per-deployment overrides (values.local.yml)

variables:
  catalog:
    description: UC catalog holding the status/lifecycle tables and artifacts volume
    default: main
  schema:
    description: UC schema holding the status/lifecycle tables and artifacts volume
    default: default
  budget_policy_id:
    description: Serverless budget (usage) policy id applied to the deploy job for chargeback
    default: ""
  cost_center:
    default: mlops
  team:
    default: mlops

targets:
  dev:
    default: true
    mode: development
    # Workspace host comes from the CLI `--profile`. The workspace root_path and
    # the real catalog / schema / budget policy are supplied at deploy time via a
    # gitignored values.local.yml (see values.local.example.yml).
