bundle:
  name: mlops-deploy-job

include:
  - resources/*.yml
  - "*.local.yml" # gitignored per-deployment overrides (values.local.yml)

variables:
  catalog:
    description: UC catalog holding the status/lifecycle tables and artifacts volume
    default: main
  schema:
    description: UC schema holding the status/lifecycle tables and artifacts volume
    default: default
  budget_policy_id:
    description: Serverless budget (usage) policy id applied to the deploy job for chargeback
    default: ""
  cost_center:
    default: mlops
  team:
    default: mlops

targets:
  # One target per environment. The target NAMES live here (committed); the per-environment
  # VALUES that differ (workspace host via --profile, root_path, catalog/schema, budget policy)
  # come from the gitignored values.local.yml — see values.local.example.yml.
  dev:
    default: true
    mode: development # [dev <you>] job-name prefix + paused schedules — a scratch env
  qa:
    mode: production # clean resource names + production guardrails
  prod:
    mode: production
