# Parameters every task receives. The app's run-now notebook_params (deploy_spec, deployment_id)
# override these for every notebook task in the run.
x-deploy-params: &deploy_params
  deploy_spec: "{}"
  deployment_id: "-1"
  catalog: ${var.catalog}
  schema: ${var.schema}
  # Default MLflow experiment (the form can override per deployment).
  experiment: ${var.experiment}
  # Default serverless usage policy for the serving endpoints this job creates — same policy as the
  # job itself. (The endpoints' tags are read from the job's own tags at runtime.)
  serverless_policy: ${var.budget_policy_id}
  # Lakebase Postgres coordinates for the app-facing status/lifecycle store.
  pg_host: ${var.pg_host}
  pg_database: ${var.pg_database}
  pg_endpoint: projects/${var.lakebase_project}/branches/${var.lakebase_branch_name}/endpoints/${var.lakebase_endpoint_name}
  pg_schema: ${var.pg_schema}
  app_sp: ${var.app_sp}
  # This run's id (dynamic value reference), recorded as run_id and used by on_failure.
  job_run_id: "{{job.run_id}}"

resources:
  jobs:
    deploy_model_job:
      name: mlops_deploy_model_job
      max_concurrent_runs: 5

      # Serverless usage policy + the full governance/chargeback tag map. The job reads these same
      # tags at runtime (via the SDK) and applies them to every serving endpoint it creates, so the
      # tag set is defined in exactly one place (var.resource_tags).
      budget_policy_id: ${var.budget_policy_id}
      tags: ${var.resource_tags}

      # Four steps in a straight line — each matches a stage on the app's timeline:
      #   prepare (prepare) -> register (wrapper) -> validate (validator) -> deploy (deployer)
      # plus on_failure, which records FAILED + the failed step's error when any step fails.
      # See deploy-job/README.md. A repair run re-runs the failed step and those after it.
      #
      # Retries: serverless auto-retries a failed task and a bundle can't switch that off
      # (`max_retries: 0` is dropped as a zero value), so every step is safe to re-run.
      tasks:
        - task_key: prepare
          environment_key: locked
          notebook_task:
            notebook_path: ../src/notebooks/1_prepare.py
            base_parameters: *deploy_params

        - task_key: register
          depends_on: [{task_key: prepare}]
          environment_key: locked
          notebook_task:
            notebook_path: ../src/notebooks/2_register.py
            base_parameters: *deploy_params

        - task_key: validate
          depends_on: [{task_key: register}]
          environment_key: locked
          # Builds each model's own environment (e.g. torch / transformers) — allow time for it.
          timeout_seconds: 5400
          notebook_task:
            notebook_path: ../src/notebooks/3_validate.py
            base_parameters: *deploy_params

        - task_key: deploy
          depends_on: [{task_key: validate}]
          environment_key: locked
          notebook_task:
            notebook_path: ../src/notebooks/4_deploy.py
            base_parameters: *deploy_params

        - task_key: on_failure
          depends_on:
            - {task_key: prepare}
            - {task_key: register}
            - {task_key: validate}
            - {task_key: deploy}
          run_if: AT_LEAST_ONE_FAILED
          environment_key: locked
          notebook_task:
            notebook_path: ../src/notebooks/9_on_failure.py
            base_parameters: *deploy_params

      # Reproducible dependency set for serverless compute. environment_version pins the Python
      # runtime; dependencies install the exact versions from the bundled requirements.txt
      # (synced to ${workspace.file_path} at deploy time).
      environments:
        - environment_key: locked
          spec:
            environment_version: "5"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt
