resources:
  jobs:
    deploy_model_job:
      name: mlops_deploy_model_job
      # Deployments beyond this many wait in the queue (instead of being skipped) and start as
      # running ones finish. Set per environment via var.max_concurrent_deployments.
      max_concurrent_runs: ${var.max_concurrent_deployments}
      queue:
        enabled: true

      # Serverless usage policy + the full governance/chargeback tag map. The notebook reads these
      # same job tags at runtime (via the SDK) and applies them to every serving endpoint it creates,
      # so the tag set is defined in exactly one place (var.resource_tags).
      budget_policy_id: ${var.budget_policy_id}
      tags: ${var.resource_tags}

      tasks:
        - task_key: deploy_model
          # Pinned serverless environment (below) — locks Python + all package versions
          # so a serverless base-image change can't break the run.
          environment_key: locked
          notebook_task:
            notebook_path: ../src/notebooks/deploy_model.py
            base_parameters:
              deploy_spec: "{}"
              deployment_id: "-1"
              catalog: ${var.catalog}
              schema: ${var.schema}
              # Default MLflow experiment (the form can override per deployment).
              experiment: ${var.experiment}
              # Default serverless usage policy for the serving endpoints this job creates — same
              # policy as the job itself, so all spend rolls up together. (The endpoints' tags are
              # read from the job's own tags at runtime, so they aren't passed here.)
              serverless_policy: ${var.budget_policy_id}
              # Lakebase Postgres coordinates for the app-facing status/lifecycle store. The
              # endpoint path is composed from the project name so it's set in one place.
              pg_host: ${var.pg_host}
              pg_database: ${var.pg_database}
              pg_endpoint: projects/${var.lakebase_project}/branches/${var.lakebase_branch_name}/endpoints/${var.lakebase_endpoint_name}
              pg_schema: ${var.pg_schema}
              app_sp: ${var.app_sp}
              # Credentials scope for importing from other workspaces' model registries.
              registry_secret_scope: ${var.source_registry_secret_scope}

      # Reproducible dependency set for serverless compute. environment_version pins the
      # Python runtime; dependencies install the exact versions from the bundled
      # requirements.txt (synced to ${workspace.file_path} at deploy time).
      environments:
        - environment_key: locked
          spec:
            environment_version: "5"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt
