# Copy to values.local.yml (gitignored) and fill in your deployment's real values.
# Merged into databricks.yml via the `include` glob at deploy time.
#
# EVERYTHING deployment-specific is a variable — one block per environment target
# (dev / qa / prod). Keep only the ones you use, and deploy each with `-t <env> --profile <env>`.
# The workspace HOST comes from the CLI --profile; everything else (including the deploy path) is
# a variable here. For a single environment, keep just the `dev` block.
#
# Lakebase: set `lakebase_project` (the project NAME) once — the endpoint path is composed from it.
# `pg_host` is the endpoint hostname from `databricks postgres list-endpoints` (status.hosts.host)
# and is NOT derivable from the name, so it stays a separate value. `app_sp` is the app's
# service-principal client id (from `databricks apps get <APP_NAME> -o json`) — the notebook grants
# it SELECT/INSERT; leave it blank until the app is deployed, then fill it and redeploy the job.
targets:
  dev:
    variables:
      root_path: /Workspace/Users/<you>@example.com/model-deployer-dev/deploy-job
      # Unity Catalog (registered models + artifacts volume)
      catalog: <dev_catalog>
      schema: <dev_schema>
      # MLflow experiment used at deploy time (a deployment can override it in the form)
      experiment: /Users/<you>@example.com/experiments/model_deployer_dev
      # Serverless usage policy — applied to the job, the app, AND serving endpoints
      budget_policy_id: <dev-serverless-usage-policy-id>
      # Chargeback tags (applied to the job + every serving endpoint; environment tag is automatic)
      application: mlops_model_deployer
      cost_center: <your_cost_center>
      team: <your_team>
      # Lakebase (the app's read store) — set the project name; paths are composed from it
      lakebase_project: <dev-lakebase-project>
      # lakebase_branch_name: production   # defaults shown; override only if non-standard
      # lakebase_endpoint_name: primary
      pg_host: <dev-endpoint>.database.<region>.azuredatabricks.net
      # pg_database: databricks_postgres
      # pg_schema: model_deployer
      app_sp: <dev-app-sp-client-id>       # fill after the app is deployed, then redeploy the job
  qa:
    variables:
      root_path: /Workspace/Shared/model-deployer-qa/deploy-job
      catalog: <qa_catalog>
      schema: <qa_schema>
      experiment: /Shared/experiments/model_deployer_qa
      budget_policy_id: <qa-serverless-usage-policy-id>
      application: mlops_model_deployer
      cost_center: <your_cost_center>
      team: <your_team>
      lakebase_project: <qa-lakebase-project>
      pg_host: <qa-endpoint>.database.<region>.azuredatabricks.net
      app_sp: <qa-app-sp-client-id>
  prod:
    variables:
      root_path: /Workspace/Shared/model-deployer-prod/deploy-job
      catalog: <prod_catalog>
      schema: <prod_schema>
      experiment: /Shared/experiments/model_deployer_prod
      budget_policy_id: <prod-serverless-usage-policy-id>
      application: mlops_model_deployer
      cost_center: <your_cost_center>
      team: <your_team>
      lakebase_project: <prod-lakebase-project>
      pg_host: <prod-endpoint>.database.<region>.azuredatabricks.net
      app_sp: <prod-app-sp-client-id>
