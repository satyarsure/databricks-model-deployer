bundle:
  name: model-deployer

include:
  - "*.local.yml" # gitignored per-deployment overrides (values.local.yml)

variables:
  app_name:
    description: Databricks App name (must match the pre-created app)
    default: model-deployer-app
  lakebase_branch:
    description: Lakebase branch resource path (projects/<p>/branches/<b>)
  lakebase_database:
    description: Lakebase database resource path (projects/<p>/branches/<b>/databases/<d>)
  job_id:
    description: Numeric Databricks job ID for the deploy job.

resources:
  apps:
    app:
      name: ${var.app_name}
      description: 'Deploy model artifacts to Databricks Model Serving'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # The resources which this app has access to.
      resources:
        # Lakebase Postgres: the app reads the model_deployer schema (job-owned; the job grants
        # this SP SELECT). CAN_CONNECT_AND_CREATE provisions the SP as a Postgres role.
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: job
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN

targets:
  # One target per environment. The target NAMES live here (committed); the per-environment
  # VALUES that differ (workspace host via --profile, root_path, app_name, warehouse/job IDs)
  # come from the gitignored values.local.yml — see values.local.example.yml.
  dev:
    default: true
    mode: development
  qa:
    mode: production
  prod:
    mode: production
