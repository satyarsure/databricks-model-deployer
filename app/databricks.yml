bundle:
  name: model-deployer

include:
  - "*.local.yml" # gitignored per-deployment overrides (values.local.yml)

# Every deployment-specific value is a variable, set per environment in the gitignored
# values.local.yml. The Lakebase resource paths are composed from the project name so it's
# supplied in exactly one place (matching deploy-job/databricks.yml).
variables:
  app_name:
    description: Databricks App name
    default: model-deployer-app
  root_path:
    description: Workspace path this bundle deploys to (maps to workspace.root_path). Set per target.
    default: ""
  job_id:
    description: Numeric Databricks job ID for the deploy job.
  budget_policy_id:
    description: >-
      Serverless usage (budget) policy id for the app's compute — same policy as the deploy job
      and serving endpoints, so all Model Deployer serverless spend rolls up together. (Databricks
      Apps do not support custom tags via DABs; this policy is the app's cost-attribution handle.)
    default: ""
  lakebase_project:
    description: Lakebase project name (same value as the deploy job's lakebase_project)
    default: ""
  lakebase_branch_name:
    description: Lakebase branch name
    default: production
  lakebase_database_name:
    description: Lakebase database resource-path segment (from `postgres list-databases`)
    default: databricks-postgres

resources:
  apps:
    app:
      name: ${var.app_name}
      description: 'Deploy model artifacts to Databricks Model Serving'
      source_code_path: ./
      # Serverless usage policy for the app's compute (cost attribution — apps take no tags).
      budget_policy_id: ${var.budget_policy_id}

      # Start the app automatically on deploy.
      lifecycle:
        started: true

      # The resources which this app has access to.
      resources:
        # Lakebase Postgres: the app reads the model_deployer schema (job-owned; the job grants
        # this SP SELECT). CAN_CONNECT_AND_CREATE provisions the SP as a Postgres role. Paths are
        # composed from the project name so it's set once (see variables above).
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch_name}
            database: projects/${var.lakebase_project}/branches/${var.lakebase_branch_name}/databases/${var.lakebase_database_name}
            permission: CAN_CONNECT_AND_CREATE
        - name: job
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN

# The deploy path is a variable too, so the whole per-environment config lives under `variables:`
# in values.local.yml.
workspace:
  root_path: ${var.root_path}

targets:
  # One target per environment. The target NAMES live here (committed); the per-environment
  # VALUES that differ (workspace host via --profile, root_path, app_name, warehouse/job IDs)
  # come from the gitignored values.local.yml — see values.local.example.yml.
  dev:
    default: true
    mode: development
  qa:
    mode: production
  prod:
    mode: production
