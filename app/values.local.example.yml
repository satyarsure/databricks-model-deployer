# Copy to values.local.yml (gitignored) and fill in your deployment's real values.
# Merged into databricks.yml via the `include` glob at deploy time.
#
# One block per environment target (dev / qa / prod) — keep only the ones you use, and deploy
# each with `-t <env> --profile <env>`. The workspace HOST comes from the CLI --profile, not here.
# `job_id` is that environment's deploy-job id. lakebase_branch/lakebase_database are the Lakebase
# resource paths the app reads from (get them via `databricks postgres list-branches/list-databases`).
# For a single environment, keep just the `dev` block.
targets:
  dev:
    workspace:
      root_path: /Workspace/Users/<you>@example.com/model-deployer-dev/app
    variables:
      app_name: <dev-app-name>
      lakebase_branch: projects/<dev-project>/branches/production
      lakebase_database: projects/<dev-project>/branches/production/databases/databricks-postgres
      job_id: <dev-deploy-job-id>
  qa:
    workspace:
      root_path: /Workspace/Shared/model-deployer-qa/app
    variables:
      app_name: <qa-app-name>
      lakebase_branch: projects/<qa-project>/branches/production
      lakebase_database: projects/<qa-project>/branches/production/databases/databricks-postgres
      job_id: <qa-deploy-job-id>
  prod:
    workspace:
      root_path: /Workspace/Shared/model-deployer-prod/app
    variables:
      app_name: <prod-app-name>
      lakebase_branch: projects/<prod-project>/branches/production
      lakebase_database: projects/<prod-project>/branches/production/databases/databricks-postgres
      job_id: <prod-deploy-job-id>
